server:
  port: ${API_PORT:8080}
  servlet:
    context-path: /
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  application:
    name: mini-crm-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${JAVA_DATABASE_URL:jdbc:postgresql://localhost:55432/mini_crm}
    username: ${POSTGRES_USER:crm}
    password: ${POSTGRES_PASSWORD:crm_local_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
app:
  jwt:
    secret: ${JWT_ACCESS_SECRET:replace-with-a-long-development-secret}
    expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    service-token: ${AI_SERVICE_TOKEN:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:8000}
    total-budget-ms: ${AI_TOTAL_BUDGET_MS:10000}
    model: ${LLM_MODEL:deepseek-chat}
    intent-score-prompt-version: ${AI_PROMPT_INTENT_SCORE_VERSION:intent-score-v1}
    follow-up-summary-prompt-version: ${AI_PROMPT_FOLLOW_UP_SUMMARY_VERSION:follow-up-summary-v1}
    next-action-prompt-version: ${AI_PROMPT_NEXT_ACTION_VERSION:next-action-v1}
    script-prompt-version: ${AI_PROMPT_SCRIPT_VERSION:script-v1}
    wake-up-prompt-version: ${AI_PROMPT_WAKE_UP_VERSION:wake-up-v1}
  import:
    storage-dir: ${IMPORT_STORAGE_DIR:./data/imports}
  scheduler:
    task-reminder:
      enabled: ${TASK_REMINDER_ENABLED:false}
      fixed-delay-ms: ${TASK_REMINDER_FIXED_DELAY_MS:60000}
      batch-size: ${TASK_REMINDER_BATCH_SIZE:100}
springdoc:
  api-docs:
    path: /api/docs-json
  swagger-ui:
    path: /api/docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.minicrm: DEBUG
